---
originRequest:
  originServerName: "${SECRET_CLUSTER_NAME}.${SECRET_DOMAIN}"

ingress:
  - hostname: "${SECRET_DOMAIN}"
    # service: https://ingress-nginx-external-controller.network.svc.cluster.local:443
    service: https://ingress-haproxy-external.network.svc.cluster.local:8443
  - hostname: "*.${SECRET_DOMAIN}"
    # service: https://ingress-nginx-external-controller.network.svc.cluster.local:443
    service: https://ingress-haproxy-external.network.svc.cluster.local:8443
  - service: http_status:404
