---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ingress-haproxy-external
spec:
  interval: 30m
  chart:
    spec:
      chart: kubernetes-ingress
      version: 1.52.1
      sourceRef:
        kind: HelmRepository
        name: ingress-haproxy
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  dependsOn:
    - name: cloudflared
      namespace: network
  # https://github.com/haproxytech/helm-charts/blob/main/kubernetes-ingress/values.yaml
  values:
    fullnameOverride: *app
    controller:
      name: controller
      replicaCount: 1
      ingressClass: external
      ingressClassResource:
        name: external
        default: false
      service:
        annotations:
          external-dns.alpha.kubernetes.io/hostname: "${SECRET_CLUSTER_NAME}.${SECRET_DOMAIN}"
          lbipam.cilium.io/ips: "192.168.1.48"
        type: LoadBalancer
      defaultTLSSecret:
        enabled: true
        # secretNamespace: '{{ include "kubernetes-ingress.namespace" . }}'
        secret: "${SECRET_DOMAIN/./-}-production-tls"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-haproxy
              app.kubernetes.io/instance: ingress-haproxy-external
              app.kubernetes.io/component: controller
      resources:
        requests:
          cpu: 10m
          memory: 512Mi
        limits:
          memory: 512Mi
    defaultBackend:
      enabled: false
